<div class="cart-container">

  <h2>Your Cart</h2>

  <!-- Empty Cart -->
  <div *ngIf="cartService.cartItems().length === 0">
    <p>🛒 Cart is empty</p>
  </div>

  <!-- Cart Items -->
  <div class="cart-item" *ngFor="let item of cartService.cartItems()">

    <img [src]="item.ImageUrl"
         alt="{{ item.ProductName }}"
         width="100" />

    <div class="item-details">
      <h3>{{ item.ProductName }}</h3>
      <p>Price: ${{ item.Price }}</p>
      
      <div class="qty-controls">
        <button (click)="removeOne(item.ProductId)">-</button>
        <span>{{ item.Quantity }}</span>
        <button (click)="addOne(item.ProductId)">+</button>
      </div>

      <button class="remove" (click)="removeItem(item.ProductId)">
        Remove
      </button>
    </div>

  </div>

  <!-- Summary -->
  <div class="summary">
    <h3>Total Items: {{ cartService.totalItems() }}</h3>
    <h3>Total Price: ${{ cartService.getTotal() }}</h3>
  </div>

  <!-- Checkout -->
  <button class="checkout-btn" routerLink="/checkout">
    Proceed to Checkout
  </button>

</div>
