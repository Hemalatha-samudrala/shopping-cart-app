<div class="admin-container">

  <h2>Admin Product Dashboard</h2>

  <!-- FORM -->
  <div class="form-box">

    <input [(ngModel)]="product.product_name" placeholder="Product Name">
    <input [(ngModel)]="product.price" placeholder="Price">
    <input type="number" [(ngModel)]="product.stock" placeholder="Stock" />
    <select [(ngModel)]="product.category_id">
  <option [ngValue]="null">Select Category</option>
  <option *ngFor="let c of categories()" [ngValue]="c.id">
    {{ c.name }}
  </option>
</select>

    <!-- IMAGE UPLOAD -->
    <input type="file" (change)="onFileSelected($event)">

    <button *ngIf="!isEditMode" class="primary-btn" (click)="addProduct()">
      Add Product
    </button>

    <button *ngIf="isEditMode" class="primary-btn" (click)="updateProduct()">
      Update Product
    </button>

    <button *ngIf="isEditMode" class="cancel-btn" (click)="resetForm()">
      Cancel
    </button>

  </div>

  <hr>

  <!-- PRODUCT LIST -->
  <div class="grid">

    <div class="card" *ngFor="let p of products()">

      <img [src]="p.image_url" />

      <h3>{{ p.product_name }}</h3>
      <p>${{ p.price }}</p>

      <button (click)="editProduct(p)">Edit</button>
      <button (click)="deleteProduct(p.Id)">Delete</button>

    </div>
    <button (click)="loadProducts()" [disabled]="!hasMore">
  Load More
</button>
  </div>



</div>
