<div class="container mt-5">

  <h2>Reset Password</h2>

  <input
    type="password"
    class="form-control mb-3"
    [(ngModel)]="password"
    placeholder="New Password">

  <button
    class="btn btn-success"
    (click)="submit()">

    Reset Password
  </button>

  <p class="mt-3">
    {{ message }}
  </p>

</div>
