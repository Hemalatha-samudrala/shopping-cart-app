<div class="container mt-5">

  <h2>Forgot Password</h2>

  <input
    type="email"
    class="form-control mb-3"
    [(ngModel)]="email"
    placeholder="Email">

  <button
    class="btn btn-primary"
    (click)="submit()">

    Send Reset Link
  </button>

  <p class="mt-3">
    {{ message }}
  </p>

</div>
